name: Python CI

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check-style-and-lint:
    name: Check style and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Setup Azure CLI Dev
        run: |
          python -m venv env
          source env/bin/activate

          pip install -r ./requirements.txt
          pip install azdev

          azdev setup -r ./ -e partnercenter
          azdev extension repo add .
          azdev extension add partnercenter
      - name: Check style
        run: |
          source env/bin/activate
          azdev style partnercenter
      - name: Check linter
        run: |
          source env/bin/activate
          azdev linter partnercenter

  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Azure Login
        uses: azure/login@cb79c773a3cfa27f31f25eb3f677781210c9ce3d # v1.6.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Setup Azure CLI Dev
        run: |
          python -m venv env
          source env/bin/activate

          pip install -r ./requirements.txt
          pip install azdev

          azdev setup -r ./ -e partnercenter
          azdev extension repo add .
          azdev extension add partnercenter
      - name: Execute tests
        run: |
          source env/bin/activate
          azdev test partnercenter --series
