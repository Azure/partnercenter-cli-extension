name: Python CI

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check-style-and-lint:
    name: Check style and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Setup Azure CLI Dev
        run: |
          python -m venv env
          source env/bin/activate

          pip install -r ./requirements.txt
          pip install azdev

          azdev setup -r ./ -e partnercenter
          azdev extension repo add .
          azdev extension add partnercenter
      - name: Check style
        run: |
          source env/bin/activate
          azdev style partnercenter
      - name: Check linter
        run: |
          source env/bin/activate
          azdev linter partnercenter

  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Setup Azure CLI Dev
        run: |
          python -m venv env
          source env/bin/activate

          pip install -r ./requirements.txt
          pip install azdev

          azdev setup -r ./ -e partnercenter
          azdev extension repo add .
          azdev extension add partnercenter
      - name: Execute tests
        run: |
          source env/bin/activate
          azdev test partnercenter --series
